<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MC/DC runtime data layout</title>
  <desc id="desc">A cell refers to its boundary surfaces, and a surface refers to an attached surface-crossing tally. The cell and surfaces are stored directly. The tally has a common base record and a concrete surface-crossing record. Their variable-length ID lists and tally values are flattened into a shared data array.</desc>
  <defs>
    <style>
      .title { font-family: system-ui, sans-serif; font-size: 23px; font-weight: 700; fill: #17202a; }
      .label { font-family: system-ui, sans-serif; font-size: 17px; font-weight: 650; fill: #17202a; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px; fill: #273746; }
      .body { font-family: system-ui, sans-serif; font-size: 14px; fill: #273746; }
      .small { font-family: system-ui, sans-serif; font-size: 12px; fill: #566573; }
      .box { stroke: #34495e; stroke-width: 2; rx: 10; }
    </style>
  </defs>

  <text x="600" y="35" text-anchor="middle" class="title">Connected model objects become fixed-layout records and flat data</text>

  <rect x="35" y="75" width="300" height="470" class="box" fill="#eaf2f8"/>
  <text x="185" y="108" text-anchor="middle" class="label">Python model objects</text>

  <line x1="185" y1="230" x2="185" y2="270" stroke="#566573" stroke-width="2.5"/>
  <text x="200" y="255" class="small">bounded by</text>
  <line x1="185" y1="375" x2="185" y2="415" stroke="#566573" stroke-width="2.5"/>
  <text x="200" y="400" class="small">filters</text>

  <rect x="65" y="130" width="240" height="100" class="box" fill="#ffffff"/>
  <text x="85" y="160" class="mono">Cell</text>
  <text x="85" y="188" class="mono">region = +lower &amp; -upper</text>
  <text x="85" y="216" class="body">directly stored object</text>

  <rect x="65" y="270" width="240" height="105" class="box" fill="#ffffff"/>
  <text x="85" y="300" class="mono">lower = PlaneZ(z=0)</text>
  <text x="85" y="328" class="mono">upper = PlaneZ(z=2)</text>
  <text x="85" y="356" class="body">directly stored surfaces</text>

  <rect x="65" y="415" width="240" height="110" class="box" fill="#ffffff"/>
  <text x="85" y="445" class="mono">Tally</text>
  <text x="85" y="473" class="mono">surface = upper</text>
  <text x="85" y="501" class="mono">cell = cell</text>
  <text x="85" y="518" class="body">surface-crossing tally</text>

  <rect x="400" y="75" width="420" height="470" class="box" fill="#fef9e7"/>
  <text x="610" y="108" text-anchor="middle" class="label">structured simulation</text>

  <line x1="610" y1="210" x2="610" y2="235" stroke="#566573" stroke-width="2.5"/>
  <text x="625" y="228" class="small">surface IDs</text>
  <line x1="610" y1="335" x2="610" y2="360" stroke="#566573" stroke-width="2.5"/>
  <text x="625" y="353" class="small">tally ID</text>
  <line x1="610" y1="440" x2="610" y2="455" stroke="#566573" stroke-width="2.5"/>
  <text x="625" y="452" class="small">sub_ID</text>

  <rect x="425" y="125" width="370" height="85" class="box" fill="#ffffff"/>
  <text x="445" y="154" class="mono">cells[0]</text>
  <text x="445" y="180" class="mono">N_surface = 2</text>
  <text x="445" y="203" class="mono">surface_IDs_offset = 0</text>

  <rect x="425" y="235" width="370" height="100" class="box" fill="#ffffff"/>
  <text x="445" y="264" class="mono">surfaces[0], surfaces[1]</text>
  <text x="445" y="290" class="mono">type = SURFACE_PLANE_Z</text>
  <text x="445" y="313" class="mono">surfaces[1].N_surface_crossing_tally = 1</text>
  <text x="445" y="330" class="small">surface_crossing_tally_IDs_offset = 2</text>

  <rect x="425" y="360" width="370" height="80" class="box" fill="#ffffff"/>
  <text x="445" y="389" class="mono">tallies[0]</text>
  <text x="445" y="413" class="mono">sub_type = TALLY_SURFACE_CROSSING</text>
  <text x="445" y="434" class="mono">sub_ID = 0</text>

  <rect x="425" y="455" width="370" height="80" class="box" fill="#ffffff"/>
  <text x="445" y="482" class="mono">surface_crossing_tallies[0]</text>
  <text x="445" y="505" class="mono">surface_filter_ID = 1</text>
  <text x="445" y="528" class="mono">cell_filter_ID = 0</text>

  <line x1="335" y1="180" x2="400" y2="168" stroke="#566573" stroke-width="2.5"/>
  <line x1="335" y1="322" x2="400" y2="285" stroke="#566573" stroke-width="2.5"/>
  <line x1="335" y1="470" x2="400" y2="398" stroke="#566573" stroke-width="2.5"/>

  <rect x="875" y="75" width="290" height="470" class="box" fill="#e8f8f5"/>
  <text x="1020" y="108" text-anchor="middle" class="label">flat data array</text>

  <rect x="905" y="145" width="230" height="55" class="box" fill="#d5f5e3"/>
  <text x="1020" y="169" text-anchor="middle" class="mono">0 · 1</text>
  <text x="1020" y="191" text-anchor="middle" class="body">cell.surface_IDs</text>

  <rect x="905" y="260" width="230" height="55" class="box" fill="#d6eaf8"/>
  <text x="1020" y="284" text-anchor="middle" class="mono">0</text>
  <text x="1020" y="306" text-anchor="middle" class="body">surface-crossing tally IDs</text>

  <rect x="905" y="385" width="230" height="55" class="box" fill="#f5eef8"/>
  <text x="1020" y="409" text-anchor="middle" class="mono">… scores and bins …</text>
  <text x="1020" y="431" text-anchor="middle" class="body">tally variable fields</text>

  <text x="1020" y="505" text-anchor="middle" class="mono">data[0:N]</text>
  <line x1="820" y1="168" x2="875" y2="172" stroke="#566573" stroke-width="2.5"/>
  <line x1="820" y1="285" x2="875" y2="287" stroke="#566573" stroke-width="2.5"/>
  <line x1="820" y1="398" x2="875" y2="412" stroke="#566573" stroke-width="2.5"/>

  <rect x="180" y="590" width="840" height="95" class="box" fill="#f4ecf7"/>
  <text x="600" y="620" text-anchor="middle" class="label">generated mcdc_get / mcdc_set helpers</text>
  <text x="600" y="647" text-anchor="middle" class="mono">mcdc_get.cell.surface_IDs(i, cell, data)</text>
  <text x="600" y="670" text-anchor="middle" class="mono">mcdc_get.surface.surface_crossing_tally_IDs(i, surface, data)</text>

  <line x1="610" y1="545" x2="610" y2="590" stroke="#566573" stroke-width="2.5"/>
  <line x1="1020" y1="545" x2="845" y2="590" stroke="#566573" stroke-width="2.5"/>
</svg>
