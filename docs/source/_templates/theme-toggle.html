{# A two-state light/dark toggle that replaces the theme's dropdown. #}
<button
  class="mcdc-theme-toggle btn btn-sm nav-link pst-navbar-icon pst-js-only"
  type="button"
  aria-label="{{ _('Switch color mode') }}"
  title="{{ _('Switch color mode') }}"
>
  <i class="fa-solid fa-sun fa-lg fa-fw only-light" aria-hidden="true"></i>
  <i class="fa-solid fa-moon fa-lg fa-fw only-dark" aria-hidden="true"></i>
</button>
