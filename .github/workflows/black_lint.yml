name: Black Style Check

on:
  push:
  pull_request:

jobs:
  black-lint:
    # Temporary suppression while validating Python compatibility on make_release.
    if: github.ref_name != 'make_release' && github.head_ref != 'make_release'
    name: Lint with Black
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Black
        run: |
          pip install --upgrade pip
          pip install black

      - name: Run Black (check mode)
        run: black --check .
